[package]
name = "autumn-plugin-clickhouse"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Autumn plugin: a ClickHouse OLAP client with batch inserts, typed queries, and migrations."
license = "Apache-2.0"
repository = "https://github.com/madmax983/autumn-plugin-clickhouse"
keywords = ["autumn", "clickhouse", "olap", "analytics", "plugin"]
categories = ["web-programming", "database"]
exclude = [".github/", "docs/", "CLAUDE.md", "clippy.toml", "proptest-regressions/"]

[features]
# `tls` enables HTTPS ClickHouse URLs (for example ClickHouse Cloud) through rustls.
default = ["tls"]
tls = ["clickhouse/rustls-tls"]

[dependencies]
# No default features: the host app selects the Autumn features.
autumn-web = { version = ">=0.7, <0.8", default-features = false }
axum = { version = "0.8", default-features = false }
# No default features: the plugin asks for no compression. `tls` adds HTTPS.
clickhouse = { version = "0.14", default-features = false, features = ["inserter"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
# `test-util` gives the mock server for tests. It stays out of the normal build.
clickhouse = { version = "0.14", features = ["test-util"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
